<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Compare Properties - SmartHomes
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
                url("{{ url_for('static', filename='rental.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #222;
        }

        /* ====================================================
           TOP NAVIGATION (matches rentals.html / property_details.html)
        ==================================================== */

        .top-nav {
            background-color: rgba(51, 51, 51, 0.95);
            padding: 20px 0;
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .brand {
            color: #00aaff;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .nav-links a:hover {
            background-color: #444;
        }

        /* ====================================================
           PAGE PANEL
        ==================================================== */

        .page-wrap {
            max-width: 1200px;
            margin: 112px auto 40px;
            padding: 32px 36px;
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #0066cc;
            font-size: 2rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        #compareLoading, #compareError {
            padding: 20px;
            font-size: 1.1em;
        }

        #compareError {
            color: #a00;
            display: none;
        }

        #compareFailed {
            margin-bottom: 20px;
        }

        .compare-failed-item {
            background: #fff3f3;
            border: 1px solid #e0b4b4;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
        }

        /* ====================================================
           COMPARISON TABLE
           (kept solid and dense on purpose: this is a data-comparison
           grid, not a decorative surface - readability over glass.)
        ==================================================== */

        .compare-table-scroll {
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        table.compare-table {
            width: 100%;
            min-width: 520px;
            border-collapse: collapse;
            background: white;
        }

        table.compare-table th,
        table.compare-table td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            vertical-align: top;
            text-align: left;
        }

        table.compare-table th.dimension-label {
            background: #f0f4fa;
            font-weight: bold;
            white-space: nowrap;
            color: #333;
        }

        table.compare-table th.property-column-header {
            background: rgba(51, 51, 51, 0.95);
            color: white;
        }

        table.compare-table th.category-ratings-header {
            text-align: center;
            background: #d5e0ee;
            color: #0066cc;
        }

        .source-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .source-badge.smarthomes {
            background: #0066cc;
            color: white;
        }

        .source-badge.squareyards {
            background: #e67e22;
            color: white;
        }

        .compare-image {
            max-width: 160px;
            max-height: 120px;
            display: block;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .not-available {
            color: #999;
            font-style: italic;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .rating-bar-track {
            flex: 1;
            background: #eee;
            border-radius: 4px;
            height: 10px;
            overflow: hidden;
        }

        .rating-bar-fill {
            height: 100%;
            background: #2ecc71;
        }

        .rating-score {
            font-weight: bold;
            white-space: nowrap;
        }

        .rating-reason {
            font-size: 0.8em;
            color: #555;
            margin: 0 0 10px 0;
        }

        .overall-rating {
            font-size: 1.3em;
            font-weight: bold;
            color: #0066cc;
            margin-bottom: 4px;
        }

        .overall-basis {
            font-size: 0.8em;
            color: #555;
        }

        .clear-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            color: #0066cc;
            cursor: pointer;
            background: rgba(0, 102, 204, 0.08);
            border: 1px solid rgba(0, 102, 204, 0.4);
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            transition: background-color 0.3s, color 0.3s;
        }

        .clear-link:hover {
            background-color: rgba(0, 102, 204, 0.85);
            color: white;
        }

        @media (max-width: 768px) {
            .page-wrap {
                margin: 100px 12px 24px;
                padding: 20px 16px;
            }

            .nav-links {
                gap: 8px;
            }

            .nav-links a {
                padding: 8px 10px;
                font-size: 14px;
            }
        }

    </style>

</head>

<body>

    <div class="top-nav">
        <div class="nav-content">

            <a href="{{ url_for('home') }}" class="brand">SMART HOMES</a>

            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('property.rentals') }}">Rentals</a>
                <a href="{{ url_for('design.design') }}">Design Your Home</a>
            </div>

        </div>
    </div>

    <div class="page-wrap">

        <h1>Compare Properties</h1>

        <div id="compareLoading">Loading comparison&hellip;</div>

        <div id="compareError"></div>

        <div id="compareFailed"></div>

        <div class="compare-table-scroll" id="compareTableWrap"></div>

        <button type="button" class="clear-link" id="compareClearLink">
            Clear comparison and start over
        </button>

    </div>

    <script src="{{ url_for('static', filename='comparison.js') }}"></script>
    <script src="{{ url_for('static', filename='compare_page.js') }}"></script>

</body>

</html>
